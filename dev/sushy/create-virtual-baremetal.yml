---
- name: Create Libvirt vBMC nodes
  gather_facts: false
  become: true
  hosts: sushy-libvirt
  tasks:
    - block:
      - name: Gather facts
        setup:

      - name: Define vBMC network
        community.libvirt.virt_net:
          command: define
          name: vbmc-net
          xml: "{{ lookup('template', kayobe_env_config_path + '/ansible/vbmc-net.xml.j2') }}"
        run_once: true

      - name: Start vBMC network
        community.libvirt.virt_net:
          state: active
          name: vbmc-net
        run_once: true

      - name: Define vBMC storage pool
        community.libvirt.virt_pool:
          command: define
          name: default
          xml: "{{ lookup('template', kayobe_env_config_path + '/ansible/vbmc-pool.xml.j2') }}"
        run_once: true

      - name: Start vBMC storage pool
        community.libvirt.virt_pool:
          state: active
          name: default
        run_once: true

      - import_role: 
          name: stackhpc.libvirt-vm
        vars:
          libvirt_vm_arch: x86_64
          libvirt_vms:
            - state: present
              name: "{{ inventory_hostname }}"
              xml_file: "{{ kayobe_env_config_path }}/ansible/vbmc-node.xml.j2"
              volumes:
                - name: '{{ inventory_hostname }}.qcow2'
                  device: 'disk'
                  format: 'qcow2'
                  capacity: '20GB'
                  pool: 'default'
              interfaces:
                - network: 'breth1'
              start: false
              autostart: false
              boot_firmware: uefi
      delgate_to:  "{{ sushy_host | default('localhost') }}"
