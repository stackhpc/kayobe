---
- name: Ensure dependencies are installed
  hosts: controllers[0]
  gather_facts: true
  vars:
    venv: "{{ virtualenv_path }}/openstacksdk"
  roles:
    - role: stackhpc.openstack.os_openstacksdk
      os_openstacksdk_venv: "{{ venv }}"
      os_openstacksdk_install_epel: "{{ dnf_install_epel }}"
      os_openstacksdk_upper_constraints_file: "{{ openstacksdk_upper_constraints_file }}"

- name: Ensure baremetal nodes are registered in ironic
  hosts: "{{ baremetal_register_group | default('baremetal') }}"
  gather_facts: false
  max_fail_percentage: >-
    {{ baremetal_register_max_fail_percentage |
       default(baremetal_compute_max_fail_percentage) |
       default(kayobe_max_fail_percentage) |
       default(100) }}
  tags:
    - baremetal
  vars:
    controller_host: "{{ groups['controllers'][0] }}"
    venv: "{{ virtualenv_path }}/openstacksdk"
    ansible_python_interpreter: "{{ venv }}/bin/python"
  tasks:
    - name: Check Ironic variables are defined
      ansible.builtin.assert:
        that:
          - ironic_driver | default('', true) | length > 0
          - ironic_driver_info | length > 0
          - ironic_properties | length > 0
          - ironic_resource_class | default('', true) | length > 0
        fail_msg: One or more Ironic variables are undefined.

    - name: Enroll baremetal nodes in Ironic
      openstack.cloud.baremetal_node:
        auth_type: "{{ openstack_auth_type }}"
        auth: "{{ openstack_auth }}"
        bios_interface: "{{ ironic_bios_interface }}"
        boot_interface: "{{ ironic_boot_interface }}"
        ca_cert: "{{ openstack_cacert | default(omit, true) }}"
        chassis_id: "{{ ironic_chassis_id }}"
        console_interface: "{{ ironic_console_interface }}"
        deploy_interface: "{{ ironic_deploy_interface }}"
        driver: "{{ ironic_driver }}"
        driver_info: "{{ ironic_driver_info }}"
        id: "{{ ironic_uuid | default(omit) }}"
        inspect_interface: "{{ ironic_inspect_interface }}"
        interface: "{{ openstack_interface | default(omit, true) }}"
        management_interface: "{{ ironic_management_interface }}"
        name: "{{ inventory_hostname }}"
        network_interface: "{{ ironic_network_interface | default(omit) }}"
        power_interface: "{{ ironic_power_interface }}"
        properties: "{{ ironic_properties }}"
        raid_interface: "{{ ironic_raid_interface }}"
        rescue_interface: "{{ ironic_rescue_interface }}"
        resource_class: "{{ ironic_resource_class }}"
        storage_interface: "{{ ironic_storage_interface }}"
        timeout: "{{ ironic_timeout }}"
        vendor_interface: "{{ ironic_vendor_interface }}"
        wait: "{{ ironic_wait }}"
      register: baremetal_node_register_result
      delegate_to: "{{ controller_host }}"
      vars:
        # NOTE: Without this, the controller's ansible_host variable will not
        # be respected when using delegate_to.
        ansible_host: "{{ hostvars[controller_host].ansible_host | default(controller_host) }}"

    # The openstack.cloud.baremetal_node module cannot move a newly
    # enrolled node beyond the 'enroll' provision state without a MAC
    - name: Manage baremetal nodes
      include_role:
        name: stackhpc.os-ironic-state
      vars:
        os_ironic_state_auth_type: "{{ openstack_auth_type }}"
        os_ironic_state_auth: "{{ openstack_auth }}"
        os_ironic_state_cacert: "{{ openstack_cacert | default(omit, true) }}"
        os_ironic_state_interface: "{{ openstack_interface | default(omit, true) }}"
        os_ironic_state_name: "{{ inventory_hostname }}"
        os_ironic_state_provision_state: manage
        os_ironic_state_wait: "{{ ironic_wait }}"
        os_ironic_state_timeout: "{{ ironic_timeout }}"
        os_ironic_state_delegate_to: "{{ controller_host }}"
      when: baremetal_node_register_result.node.provision_state == 'enroll'
